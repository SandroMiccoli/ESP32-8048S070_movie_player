# WiFi Access Point created by install/setup_ap.sh
# Must match WIFI_SSID / WIFI_PASSWORD in the ESP32 app_config.h
wifi:
  ssid: BOCAS-TELAS
  password: bocas123
  iface: wlan0
  ip: 192.168.4.1
  dhcp_start: 192.168.4.50
  dhcp_end: 192.168.4.200

# Audio capture (INMP441 I2S via install/setup_i2s_mic.sh, or USB/webcam)
# List devices with:  python src/main.py --list-devices
# Prefer a stable name substring over a numeric index (indexes can change across reboots).
audio:
  device: "voice"       # INMP441 / Google voiceHAT card; null = default; "USB" for USB mic
  sample_rate: 48000    # I2S overlays prefer 48 kHz; app falls back if unsupported
  channels: 2           # voiceHAT often stereo; L/R→GND puts signal on left (ch 0)
  block_ms: 50          # analysis window size
  threshold_dbfs: -30.0 # trigger when level >= this (less negative = louder); retune on device
  cooldown_s: 2.5       # ignore further triggers for this many seconds after publish

# MQTT broker on the RPi access point (mqtt.host should match wifi.ip)
mqtt:
  host: 192.168.4.1
  port: 1883
  topic: displays/trigger
  client_id: rpi-sound-trigger
  qos: 1                 # at-least-once; must match ESP32 MQTT_QOS

# On-screen VU meter / touch UI
# mode: auto   — show UI when a screen is connected, else headless (default)
#       always — always open the VU window
#       never  — always headless
# fullscreen: null = auto (fullscreen when a screen is detected)
display:
  mode: auto
  fullscreen: null
  width: 800
  height: 480
  fps: 15
  # Optional SDL driver override, e.g. x11 / wayland / kmsdrm
  # sdl_driver: x11

# Per-display volume sliders (BOCA 1/2/3). Each ESP must set DISPLAY_ID to match.
# Topics are retained so a board that joins late still gets the last volume.
volumes:
  default: 80
  bocas:
    - id: 1
      label: "BOCA 1"
      topic: displays/boca1/volume
    - id: 2
      label: "BOCA 2"
      topic: displays/boca2/volume
    - id: 3
      label: "BOCA 3"
      topic: displays/boca3/volume
